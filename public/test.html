<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisitGuard - Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #10b981, #3b82f6);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        h1 {
            font-size: 3em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        .status {
            background: rgba(255, 255, 255, 0.2);
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }
        .success {
            color: #10f981;
            font-size: 1.2em;
            font-weight: bold;
        }
        .time {
            font-size: 1.1em;
            opacity: 0.9;
        }
        .links {
            margin-top: 30px;
        }
        .links a {
            color: #60a5fa;
            text-decoration: none;
            font-size: 1.1em;
            margin: 0 10px;
            padding: 10px 20px;
            border: 2px solid #60a5fa;
            border-radius: 25px;
            transition: all 0.3s ease;
        }
        .links a:hover {
            background: #60a5fa;
            color: white;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍃 VisitGuard</h1>
        <div class="status">
            <div class="success">✅ Website Berhasil Dimuat!</div>
            <div class="time">Waktu: <span id="time"></span></div>
        </div>
        <p>Platform IoT Monitoring untuk Ketahanan Pangan Kota Depok</p>
        <div class="links">
            <a href="/test">Test Page</a>
            <a href="/auth">Login</a>
        </div>
    </div>

    <script>
        document.getElementById('time').textContent = new Date().toLocaleString('id-ID');
        
        // Test every 5 seconds
        setInterval(() => {
            document.getElementById('time').textContent = new Date().toLocaleString('id-ID');
        }, 5000);
        
        console.log('VisitGuard Test Page Loaded Successfully!');
        console.log('Next.js Server should be running on port 8888');
    </script>
</body>
</html>
